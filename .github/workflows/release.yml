name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  register:
    name: Register GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes || gh release edit "$TAG" --generate-notes