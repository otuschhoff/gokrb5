name: Lint

on:
  pull_request:
  push:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.26.11
      GOLANGCI_LINT: ${{ github.workspace }}/.bin/golangci-lint-report
      LINT_REPORT_DIR: ${{ github.workspace }}/lint-reports
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            go.sum
            v8/go.sum

      - name: Cache custom linter
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: .bin/golangci-lint-report
          key: lint-${{ runner.os }}-${{ runner.arch }}-go1.26.11-${{ hashFiles('.custom-gcl.yml') }}

      - name: Build pinned golangci-lint with NilAway
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" custom --destination "$GITHUB_WORKSPACE/.bin"

      - name: Verify profiles
        run: |
          "$GOLANGCI_LINT" version
          "$GOLANGCI_LINT" config verify --config .golangci.yml
          "$GOLANGCI_LINT" config verify --config .golangci-report.yml

      - name: Assess whole project
        shell: bash
        run: |
          for profile in full report; do
            status=0
            bash scripts/lint.sh "$profile" || status=$?
            if [ "$status" -gt 1 ]; then
              exit "$status"
            fi
            if [ "$status" -eq 1 ]; then
              echo "::notice::Existing debt found in $profile; see lint-reports artifact"
            fi
          done

      - name: Reject new findings
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [ -z "$BASE_REV" ] || [ "$BASE_REV" = 0000000000000000000000000000000000000000 ]; then
            BASE_REV=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
          elif ! git cat-file -e "$BASE_REV^{commit}" 2>/dev/null; then
            # A force-push can make the previous tip unreachable from all current refs.
            git fetch --no-tags origin "$BASE_REV"
          fi
          bash scripts/lint.sh new "$BASE_REV"

      - name: Upload full and changed-code findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: ${{ env.LINT_REPORT_DIR }}
          if-no-files-found: warn
