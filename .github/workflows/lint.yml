name: Lint

on:
  pull_request:
  push:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: go1.26.11
      GOLANGCI_LINT: ${{ github.workspace }}/.bin/golangci-lint-report
      LINT_REPORT_DIR: ${{ github.workspace }}/lint-reports
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: v8/go.sum

      - name: Cache custom linter
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: .bin/golangci-lint-report
          key: lint-${{ runner.os }}-${{ runner.arch }}-go1.26.11-${{ hashFiles('.custom-gcl.yml') }}

      - name: Build pinned golangci-lint with NilAway
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" custom --destination "$GITHUB_WORKSPACE/.bin"

      - name: Show linter version
        run: '"$GOLANGCI_LINT" version'

      - name: Report supplemental v8 findings
        shell: bash
        run: |
          status=0
          bash scripts/lint.sh report || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::notice::Supplemental v8 findings; see lint-reports artifact"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Reject canonical v8 findings
        run: bash scripts/lint.sh full

      - name: Upload v8 lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: ${{ env.LINT_REPORT_DIR }}
          if-no-files-found: warn
