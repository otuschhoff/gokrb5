# Name of the workflow needs to match the name of the major version directory
name: v8
on:
  push:
  pull_request:
    paths:
      - 'v8/**'
      - '.github/workflows/testingv8.yml'

permissions:
  contents: read

concurrency:
  group: v8-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, and module checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -s -l . | tee /dev/stderr)"

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

  unit:
    name: Unit (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.18.x'
          - os: ubuntu-latest
            go: stable
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: v8/go.sum

      - name: Run unit tests
        run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Run tests with race detector
        run: go test -race ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Collect cross-package coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total statement coverage: ${coverage}%"
          awk -v coverage="${coverage}" 'BEGIN { if (coverage + 0 < 65.0) exit 1 }'

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-coverage
          path: v8/coverage.out

  cross-build:
    name: Cross-build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            goos: windows
            goarch: amd64
          - name: macOS amd64
            goos: darwin
            goarch: amd64
          - name: macOS arm64
            goos: darwin
            goarch: arm64
          - name: Android arm64
            goos: android
            goarch: arm64
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Build packages
        run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

  ios-packages:
    name: Check iOS package graph
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Resolve iOS dependencies
        run: go list -deps ./... >/dev/null
        env:
          GOOS: ios
          GOARCH: arm64
          CGO_ENABLED: 1

  build:
    name: MIT integration (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.18.x', 'stable' ]
    env:
      TEST_KDC_ADDR: 127.0.0.1
      TEST_HTTP_URL: http://cname.test.gokrb5
      TEST_HTTP_ADDR: 127.0.0.1
      DNS_IP: 127.0.88.53
      DNSUTILS_OVERRIDE_NS: 127.0.88.53:53
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: v8/go.sum

      - name: Start integration test dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq krb5-user
          sudo chmod 666 /etc/krb5.conf
          sudo chmod 666 /var/run/docker.sock
          sudo docker run -d -h ns.test.gokrb5 -v /etc/localtime:/etc/localtime:ro -e "TEST_KDC_ADDR=${TEST_KDC_ADDR}" -e "TEST_HTTP_ADDR=${TEST_HTTP_ADDR}" -p ${DNSUTILS_OVERRIDE_NS}:53 -p ${DNSUTILS_OVERRIDE_NS}:53/udp --name dns jcmturner/gokrb5:dns
          sudo docker run -d -h kdc.test.gokrb5 -v /etc/localtime:/etc/localtime:ro -p 88:88 -p 88:88/udp -p 464:464 -p 464:464/udp --name krb5kdc jcmturner/gokrb5:kdc-centos-default
          sudo docker run -d -h kdc.test.gokrb5 -v /etc/localtime:/etc/localtime:ro -p 78:88 -p 78:88/udp --name krb5kdc-old jcmturner/gokrb5:kdc-older
          sudo docker run -d -h kdc.test.gokrb5 -v /etc/localtime:/etc/localtime:ro -p 98:88 -p 98:88/udp --name krb5kdc-latest jcmturner/gokrb5:kdc-latest
          sudo docker run -d -h kdc.resdom.gokrb5 -v /etc/localtime:/etc/localtime:ro -p 188:88 -p 188:88/udp --name krb5kdc-resdom jcmturner/gokrb5:kdc-resdom
          sudo docker run -d -h kdc.test.gokrb5 -v /etc/localtime:/etc/localtime:ro -p 58:88 -p 58:88/udp --name krb5kdc-shorttickets jcmturner/gokrb5:kdc-shorttickets
          sudo docker run -d --add-host host.test.gokrb5:127.0.0.88 -v /etc/localtime:/etc/localtime:ro -p 80:80 -p 443:443 --name gokrb5-http jcmturner/gokrb5:http
          sudo sed -i 's/nameserver .*/nameserver '${DNS_IP}'/g' /etc/resolv.conf
          dig _kerberos._udp.TEST.GOKRB5
        id: intgTestDeps

      - name: Build and run examples
        run: |
          cd v8
          go run -tags="examples" examples/example.go
          for example in example-AD.go httpClient.go httpServer.go longRunningClient.go; do
            go build -tags="examples" -o "${RUNNER_TEMP}/${example%.go}" "examples/${example}"
          done
        id: examples

      - name: Tests including integration tests
        run: |
          cd v8
          go test -race ./...
        env:
          INTEGRATION: 1
          TESTPRIVILEGED: 1
        id: intgTests

      - name: MIT interoperability tests
        run: |
          cd v8
          go test -race -tags interop ./test/interop/...
        env:
          INTEGRATION: 1
        id: interopTests

      - name: Tests (32bit)
        run: |
          cd v8
          go test ./...
        env:
          GOARCH: 386
          INTEGRATION: 1
          TESTPRIVILEGED: 1
        id: test32

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./keytab
            target: FuzzUnmarshal
          - package: ./credentials
            target: FuzzCCacheUnmarshal
          - package: ./pac
            target: FuzzPACUnmarshal
          - package: ./gssapi
            target: FuzzSecurityContextUnwrap
          - package: ./gssapi
            target: FuzzSecurityContextVerifyMIC
          - package: ./negoex
            target: FuzzNegoExUnmarshal
          - package: ./pkinit
            target: FuzzPKASRep
          - package: ./pkinit
            target: FuzzCMS
          - package: ./pku2u
            target: FuzzTrustedCertifiersUnmarshal
          - package: ./spnego
            target: FuzzUnmarshalNegToken
          - package: ./types
            target: FuzzKDCProxyMessage
          - package: ./types
            target: FuzzMSKILEUnmarshal
          - package: ./types
            target: FuzzFASTUnmarshal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Run fuzz target
        run: |
          cd v8
          go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s

  samba-ad:
    name: Samba AD integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: v8/go.sum

      - name: Build Samba AD image
        run: |
          docker build \
            --platform linux/amd64 \
            -f v8/test/testdata/docker/samba-ad-dc/Containerfile \
            -t gokrb5-samba-ad \
            v8/test/testdata/docker/samba-ad-dc

      - name: Start Samba AD domain controller
        run: |
          mkdir -p "${RUNNER_TEMP}/gokrb5-ad"
          chmod 0777 "${RUNNER_TEMP}/gokrb5-ad"
          docker run -d --privileged \
            --platform linux/amd64 \
            --name gokrb5-samba-ad \
            --hostname dc.samba.gokrb5.test \
            -v "${RUNNER_TEMP}/gokrb5-ad:/artifacts" \
            -p 88:88/tcp -p 88:88/udp \
            -p 464:464/tcp -p 464:464/udp \
            gokrb5-samba-ad
          for attempt in $(seq 1 120); do
            status=$(docker inspect --format '{{.State.Health.Status}}' gokrb5-samba-ad)
            if [[ "${status}" == "healthy" ]]; then
              exit 0
            fi
            if [[ "${status}" == "unhealthy" ]]; then
              docker logs gokrb5-samba-ad
              exit 1
            fi
            sleep 1
          done
          docker logs gokrb5-samba-ad
          exit 1

      - name: Run Samba AD tests
        run: |
          test -s "${RUNNER_TEMP}/gokrb5-ad/environment"
          test -s "${RUNNER_TEMP}/gokrb5-ad/krb5.keytab"
          test -s "${RUNNER_TEMP}/gokrb5-ad/user"
          test -s "${RUNNER_TEMP}/gokrb5-ad/pw"
          set -a
          source "${RUNNER_TEMP}/gokrb5-ad/environment"
          set +a
          cd v8
          TESTAD_DIR="${RUNNER_TEMP}/gokrb5-ad" go test -race -tags adintegration ./...

      - name: Show Samba logs on failure
        if: failure()
        run: docker logs gokrb5-samba-ad || true

      - name: Stop Samba AD domain controller
        if: always()
        run: docker rm -f gokrb5-samba-ad || true
